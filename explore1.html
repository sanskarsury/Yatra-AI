<!DOCTYPE html>
<html>
<head>
    <title>Yatra AI - Recommendations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        header {
            background: #0066ff;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        select, button {
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            background: #0066ff;
            color: white;
            cursor: pointer;
        }

        #recommendations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        .card h3 {
            color: #0066ff;
        }

        @media(max-width: 700px) {
            #recommendations {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 YATRA AI</h1>
    <p>Personalized Recommendations</p>
</header>

<div class="container">

    <h2>Find Places For You</h2>

    <select id="interest">
        <option value="all">All Interests</option>
        <option value="nature">Nature</option>
        <option value="history">History</option>
        <option value="adventure">Adventure</option>
        <option value="food">Food</option>
        <option value="culture">Culture</option>
        <option value="spiritual">Spiritual</option>
        <option value="shopping">Shopping</option>
    </select>

    <select id="budget">
        <option value="all">Any Budget</option>
        <option value="low">Budget</option>
        <option value="medium">Moderate</option>
        <option value="high">Premium</option>
    </select>

    <button onclick="recommend()">Get Recommendations</button>

    <div id="recommendations"></div>

</div>

<script>

const places = [
    {
        name: "Baga Beach",
        interest: "nature",
        budget: "medium",
        description: "Relax on the beach and enjoy beautiful sunsets."
    },

    {
        name: "Aguada Fort",
        interest: "history",
        budget: "low",
        description: "Explore a historic fort and enjoy sea views."
    },

    {
        name: "Dudhsagar Falls",
        interest: "adventure",
        budget: "medium",
        description: "Experience a beautiful waterfall and nature."
    },

    {
        name: "Goan Food Tour",
        interest: "food",
        budget: "medium",
        description: "Taste traditional and popular local dishes."
    },

    {
        name: "Fontainhas",
        interest: "culture",
        budget: "low",
        description: "Explore colourful streets and Portuguese architecture."
    },

    {
        name: "Temple Visit",
        interest: "spiritual",
        budget: "low",
        description: "Visit peaceful and culturally important temples."
    },

    {
        name: "Local Market",
        interest: "shopping",
        budget: "low",
        description: "Shop for souvenirs and local products."
    }
];


function recommend() {

    let interest =
        document.getElementById("interest").value;

    let budget =
        document.getElementById("budget").value;

    let result =
        document.getElementById("recommendations");

    let filtered = places.filter(function(place) {

        let interestMatch =
            interest === "all" ||
            place.interest === interest;

        let budgetMatch =
            budget === "all" ||
            place.budget === budget;

        return interestMatch && budgetMatch;
    });


    if (filtered.length === 0) {

        result.innerHTML =
            "<h3>No recommendations found.</h3>";

        return;
    }


    result.innerHTML = "";


    filtered.forEach(function(place) {

        result.innerHTML += `
            <div class="card">

                <h3>${place.name}</h3>

                <p>
                    📌 Interest:
                    ${place.interest}
                </p>

                <p>
                    💰 Budget:
                    ${place.budget}
                </p>

                <p>
                    ${place.description}
                </p>

                <strong>
                    ⭐ Recommended for you
                </strong>

            </div>
        `;
    });
}


recommend();

</script>

</body>
</html>
